<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Stackly Real Estate</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="404page.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="error-page">
        <div class="error-container">
            <div class="error-visual">
                <div class="error-number">
                    <span class="digit">4</span>
                    <div class="house-icon">
                        <span class="material-icons">home</span>
                    </div>
                    <span class="digit">4</span>
                </div>
            </div>

            <div class="error-content">
                <h1 class="error-title">Oops! Page Not Found</h1>
                <p class="error-description">
                    Looks like this property has been sold or moved to a different location.
                    Don't worry, we have plenty of other amazing listings waiting for you!
                </p>

                <div class="error-actions">
                    <a href="index.html" class="btn-primary">
                        <span class="material-icons">home</span>
                        Back to Home
                    </a>
                    <a href="properties.html" class="btn-secondary">
                        <span class="material-icons">search</span>
                        Browse Properties
                    </a>
                </div>


            </div>
        </div>
    </div>

    <div class="error-background">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
        <div class="floating-shape shape-4"></div>
    </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            gsap.from('.digit', {
                y: -100,
                opacity: 0,
                duration: 0.8,
                stagger: 0.2,
                ease: "back.out(1.7)"
            });

            gsap.from('.house-icon', {
                scale: 0,
                rotation: -180,
                opacity: 0,
                duration: 0.8,
                delay: 0.4,
                ease: "back.out(1.7)"
            });

            gsap.from('.house-outline', {
                y: 50,
                opacity: 0,
                duration: 0.8,
                delay: 0.6,
                ease: "power3.out"
            });

            gsap.to('.search-beam', {
                opacity: 0.3,
                scaleX: 1.2,
                duration: 1.5,
                repeat: -1,
                yoyo: true,
                ease: "power1.inOut"
            });

            gsap.from('.error-content > *', {
                y: 30,
                opacity: 0,
                duration: 0.6,
                stagger: 0.1,
                delay: 0.8,
                ease: "power3.out"
            });

            gsap.to('.floating-shape', {
                y: "random(-30, 30)",
                x: "random(-20, 20)",
                rotation: "random(-15, 15)",
                duration: "random(3, 6)",
                repeat: -1,
                yoyo: true,
                ease: "sine.inOut",
                stagger: {
                    amount: 2,
                    from: "random"
                }
            });
        });
    </script>
</body>

</html>
